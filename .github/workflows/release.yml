name: Flux Release

# Called by automatic versioning or manually; tag pushes do not duplicate builds.
on:
  workflow_call:
    inputs:
      draft:
        type: boolean
        default: true
      split:
        type: boolean
        default: false
      ref:
        type: string
        required: true
      windows:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      ref:
        description: Source tag or commit to rebuild (empty uses the selected branch)
        type: string
        default: ''
      draft:
        description: Keep the release as a draft for review
        type: boolean
        default: true
      split:
        description: Also build APKs for each ABI
        type: boolean
        default: false
      windows:
        description: Include the complete Windows ZIP
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: flux-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ inputs.windows && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Check release scripts
        run: |
          ./scripts/sync_version.ps1 -Check
          ./scripts/test_release.ps1
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            Write-Warning "Sin ANDROID_KEYSTORE_BASE64: se omite la creación de release.jks"
            exit 0
          }
          foreach ($name in @('KEY_ALIAS', 'KEY_PASSWORD', 'STORE_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing secret: $name" }
          }
          [IO.File]::WriteAllBytes('android/app/release.jks', [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          function Escape-Property([string]$Value) {
            return $Value.Replace('\', '\\').Replace("`r", '\r').Replace("`n", '\n').Replace(' ', '\ ')
          }
          $properties = @(
            'storeFile=release.jks',
            "keyAlias=$(Escape-Property $env:KEY_ALIAS)",
            "keyPassword=$(Escape-Property $env:KEY_PASSWORD)",
            "storePassword=$(Escape-Property $env:STORE_PASSWORD)"
          ) -join "`n"
          [IO.File]::WriteAllText('android/key.properties', $properties, [Text.UTF8Encoding]::new($false))
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN || secrets.ORG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_SPLIT: ${{ inputs.split }}
          RELEASE_WINDOWS: ${{ inputs.windows }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./scripts/build_release.ps1 -Publish -Draft:($env:RELEASE_DRAFT -eq 'true') -Split:($env:RELEASE_SPLIT -eq 'true') -Windows:($env:RELEASE_WINDOWS -eq 'true')
      - name: Retain release bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flux-release
          path: dist/
          if-no-files-found: ignore
          retention-days: 7

