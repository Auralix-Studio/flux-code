name: Flux Release

# A single manual trigger avoids racing local releases against tag-push builds.
on:
  workflow_dispatch:
    inputs:
      draft:
        description: Keep the release as a draft for review
        type: boolean
        default: true
      split:
        description: Also build APKs for each ABI
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: flux-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - name: Check release scripts
        run: |
          ./scripts/sync_version.ps1 -Check
          ./scripts/test_release.ps1
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('KEYSTORE_BASE64', 'KEY_ALIAS', 'KEY_PASSWORD', 'STORE_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing secret: $name" }
          }
          [IO.File]::WriteAllBytes('android/app/release.jks', [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          function Escape-Property([string]$Value) {
            return $Value.Replace('\', '\\').Replace("`r", '\r').Replace("`n", '\n').Replace(' ', '\ ')
          }
          $properties = @(
            'storeFile=release.jks',
            "keyAlias=$(Escape-Property $env:KEY_ALIAS)",
            "keyPassword=$(Escape-Property $env:KEY_PASSWORD)",
            "storePassword=$(Escape-Property $env:STORE_PASSWORD)"
          ) -join "`n"
          [IO.File]::WriteAllText('android/key.properties', $properties, [Text.UTF8Encoding]::new($false))
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_SPLIT: ${{ inputs.split }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./scripts/build_release.ps1 -Publish -Draft:($env:RELEASE_DRAFT -eq 'true') -Split:($env:RELEASE_SPLIT -eq 'true')
      - name: Retain release bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-release
          path: dist/
          if-no-files-found: ignore
          retention-days: 7

